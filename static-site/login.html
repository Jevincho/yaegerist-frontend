<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ganesha Operation</title>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <img 
                src="../Gambar/Gambar Login.png" 
                alt="Ganesha Operation" 
                class="login-image"
                onerror="this.style.display='none'"
            />
        </div>
        
        <div class="login-right">
            <a href="index.html" class="back-home">
                <i class="fa fa-arrow-left"></i> Kembali ke Beranda
            </a>
            
            <div class="login-box">
                <div class="login-header">
                    <h2 id="form-title">Masuk ke Akun</h2>
                    <p>Ganesha Operation - Platform Belajar</p>
                </div>

                <form id="loginForm" class="login-form">
                    <div id="nameField" class="form-group" style="display: none;">
                        <label>Nama Lengkap</label>
                        <input
                            type="text"
                            name="name"
                            placeholder="Masukkan nama lengkap"
                        />
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input
                            type="email"
                            name="email"
                            placeholder="Masukkan email"
                            required
                        />
                    </div>

                    <div id="passwordField" class="form-group">
                        <label>Password</label>
                        <input
                            type="password"
                            name="password"
                            placeholder="Masukkan password"
                        />
                    </div>

                    <div id="confirmPasswordField" class="form-group" style="display: none;">
                        <label>Konfirmasi Password</label>
                        <input
                            type="password"
                            name="confirmPassword"
                            placeholder="Konfirmasi password"
                        />
                    </div>

                    <div id="forgotPassword" class="forgot-password">
                        <a href="#" onclick="showResetForm(); return false;">Lupa Password?</a>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">Masuk</button>
                </form>

                <div class="divider">
                    <span>atau masuk dengan</span>
                </div>

                <div class="social-login">
                    <button class="social-btn google" onclick="alert('Fitur login sosial tersedia di aplikasi React')">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button class="social-btn facebook" onclick="alert('Fitur login sosial tersedia di aplikasi React')">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </button>
                    <button class="social-btn apple" onclick="alert('Fitur login sosial tersedia di aplikasi React')">
                        <i class="fab fa-apple"></i> Apple
                    </button>
                </div>

                <div class="form-footer">
                    <p id="switchText">
                        Belum punya akun? 
                        <a href="#" onclick="showRegisterForm(); return false;" id="switchLink">Daftar</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
