  <body>
    <section class="login">
        <form action="#">
            <h2>SELAMAT DATANG</h2>
            <div class="input-box">
                <input type="email" placeholder="Email" required>
                <i class="fa-regular fa-envelope"></i>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password" required>
                <i class="fa-solid fa-key"></i>
            </div>
            <hr>
            <button type="submit" class="btn">Login</button>
            <div class="lupa">
                <p>Lupa Password? <a href="reset.html">Reset</a></p>
            </div>
            <div class="belum-punya">
                <p>Belum punya akun? <a href="register.html">Register Sekarang</a></p>
            </div>
        </form>
        
    </section>
